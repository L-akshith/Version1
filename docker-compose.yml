version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: examshield_db
    restart: always
    environment:
      POSTGRES_USER: examshield
      POSTGRES_PASSWORD: examshield
      POSTGRES_DB: examshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examshield -d examshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: examshield_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examshield_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://examshield:examshield@db:5432/examshield
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=94bc9bf9b59637c355f32eb4a79c94519962a1db3d548f020bc8b60098dfc38f
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examshield_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
